services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka_broker:29093'
      # Dual listeners: EXTERNAL (9092) for your Windows host, INTERNAL (29092) for Spark container
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_broker:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  minio:
    image: pgsty/silo
    container_name: minio_lakehouse
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  spark:
    image: apache/spark:3.5.0
    container_name: spark_processor
    user: root
    depends_on:
      - kafka
      - minio
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka_broker:29092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
    volumes:
      - ../processing:/opt/spark/work-dir/processing
      - spark_ivy_cache:/root/.ivy2
    entrypoint: ["/bin/bash", "-c", "tail -f /dev/null"]

  postgres_warehouse:
    image: postgres:16
    container_name: postgres_warehouse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana_bi
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres_warehouse

  airflow_init:
    image: apache/airflow:2.8.4-python3.11
    container_name: airflow_init
    user: "50000:0"
    depends_on:
      - postgres_warehouse
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password123@postgres_warehouse:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Rahul --lastname Tomar --role Admin --email admin@boxoffice.local

  airflow:
    image: apache/airflow:2.8.4-python3.11
    container_name: airflow_orchestrator
    user: root
    restart: unless-stopped
    depends_on:
      - airflow_init
      - postgres_warehouse
    ports:
      - "8080:8080"
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password123@postgres_warehouse:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - DBT_PROFILES_DIR=/opt/airflow/dbt_profiles
    volumes:
      - ../airflow_dags:/opt/airflow/dags
      - ../boxoffice_warehouse:/opt/airflow/boxoffice_warehouse
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - bash
      - -c
      - |
        apt-get update && apt-get install -y docker.io &&
        pip install --no-cache-dir dbt-postgres &&
        mkdir -p /opt/airflow/dbt_profiles &&
        cat <<EOF > /opt/airflow/dbt_profiles/profiles.yml
        boxoffice_warehouse:
          target: dev
          outputs:
            dev:
              type: postgres
              host: postgres_warehouse
              user: postgres
              password: password123
              port: 5432
              dbname: boxoffice
              schema: public
              threads: 4
        EOF
        airflow scheduler & airflow webserver

volumes:
  minio_data:
  spark_ivy_cache:
  postgres_data:
  grafana_data: