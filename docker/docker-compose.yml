version: '3.8'

services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka_broker:29093'
      # Dual listeners: EXTERNAL (9092) for your Windows host, INTERNAL (29092) for Spark container
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka_broker:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  minio:
    image: pgsty/silo
    container_name: minio_lakehouse
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  spark:
      image: apache/spark:3.5.0
      container_name: spark_processor
      user: root
      depends_on:
        - kafka
        - minio
      environment:
        - KAFKA_BOOTSTRAP_SERVERS=kafka_broker:29092
        - MINIO_ENDPOINT=http://minio:9000   # <--- Ensure this has no underscore!
        - MINIO_ACCESS_KEY=admin
        - MINIO_SECRET_KEY=password123
      volumes:
        - ../processing:/opt/spark/work-dir/processing
        - spark_ivy_cache:/root/.ivy2
      entrypoint: ["/bin/bash", "-c", "tail -f /dev/null"]

  postgres_warehouse:
      image: postgres:16
      container_name: postgres_warehouse
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password123
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

volumes:
  minio_data:
  spark_ivy_cache:
  postgres_data: