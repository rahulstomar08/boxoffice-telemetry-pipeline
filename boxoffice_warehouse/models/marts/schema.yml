version: 2

models:
  - name: dim_theatres
    columns:
      - name: theatre_sk
        tests:
          - unique
          - not_null

  - name: dim_movies
    columns:
      - name: movie_sk
        tests:
          - unique
          - not_null

  - name: fct_daily_box_office
    description: "Daily aggregated net and gross box office collections per show."
    columns:
      - name: show_id
        tests:
          - unique
          - not_null
      - name: movie_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_movies')
              field: movie_sk
      - name: theatre_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_theatres')
              field: theatre_sk
      - name: total_est_gross_inr
        tests:
          - not_null
      - name: total_india_net_inr
        tests:
          - not_null

  - name: fct_show_occupancy_snapshots
    description: "Periodic snapshot fact table tracking booking velocity from T-24h to T-10m."
    columns:
      - name: snapshot_sk
        tests:
          - unique
          - not_null
      - name: movie_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_movies')
              field: movie_sk
      - name: theatre_sk
        tests:
          - not_null
          - relationships:
              to: ref('dim_theatres')
              field: theatre_sk
      - name: snapshot_window
        tests:
          - not_null
          - accepted_values:
              values: ['T-24h', 'T-6h', 'T-2h', 'T-30m', 'T-10m']
      - name: total_booked_seats
        tests:
          - not_null